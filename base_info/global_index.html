<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해외 뉴스 감시 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .news-entry {
            animation: slideDown 0.35s ease-out forwards;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 신규 뉴스 유입 시 텍스트 자체가 에메랄드빛으로 번쩍이는 효과 */
        @keyframes flash-green {
            0% { color: #10b981; text-shadow: 0 0 8px rgba(16, 185, 129, 0.6); transform: scale(1.03); }
            100% { color: #64748b; text-shadow: none; transform: scale(1); }
        }
        .flash-active {
            animation: flash-green 1.2s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen w-screen flex flex-col overflow-y-auto lg:overflow-hidden">

    <!-- 상단 간결한 헤더 (동기화 완료 배지 상단 매핑 완료) -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 lg:px-8 py-2 lg:py-4 flex flex-col lg:flex-row gap-1.5 lg:gap-0 lg:justify-between lg:items-center shrink-0">
        <div class="flex items-center gap-3 flex-1 min-w-0">
            <span class="text-xl">🌐</span>
            <h1 class="text-sm lg:text-base font-extrabold tracking-wide text-white flex items-center gap-2 shrink-0">
                해외 뉴스 시그널 감시센터
                <span class="hidden lg:inline-block text-[10px] bg-slate-800 text-blue-400 px-2.5 py-0.5 rounded-full border border-slate-700 font-normal">Active</span>
            </h1>
            <!-- 🟢 [요청사항 반영] 동기화 타임 배지가 상단 헤더 영역으로 깔끔하게 이동했습니다 -->
            <span id="time-badge" class="hidden lg:inline font-mono text-[11px] text-slate-500 font-bold tracking-tight truncate border-l border-slate-800 pl-3 ml-2 transition-all duration-200">
                동기화 대기 중...
            </span>
            <!-- 채널별 전용 감시 모드일 때 보여줄 배지 -->
            <div id="filter-status-badge" class="hidden items-center gap-2 bg-blue-950/80 border border-blue-800 px-3 py-1 rounded-lg text-xs text-blue-300 ml-3">
                <span id="active-source-name" class="font-extrabold"></span> 전용 채널 관제 중
                <a href="/global" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-black transition-colors">전체보기</a>
            </div>
        </div>
        <div class="flex items-center gap-2 lg:gap-3 shrink-0 overflow-x-auto lg:overflow-visible -mx-1 px-1 lg:mx-0 lg:px-0">
            <a href="/global-trash-view" target="_blank" class="bg-rose-950/40 hover:bg-rose-900 border border-rose-900/40 text-[10px] lg:text-xs text-rose-300 px-3 lg:px-4 py-1.5 lg:py-2 rounded-lg font-bold transition-all shadow-sm flex items-center gap-1.5 whitespace-nowrap shrink-0">
                🗑️ 격리 보관소
            </a>
            <a href="/global-keyword-settings" target="_blank" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] lg:text-xs text-slate-200 px-3 lg:px-4 py-1.5 lg:py-2 rounded-lg font-bold transition-all shadow-sm whitespace-nowrap shrink-0">
                🎯 키워드 제어
            </a>
            <a href="/global-rss-settings" target="_blank" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] lg:text-xs text-slate-200 px-3 lg:px-4 py-1.5 lg:py-2 rounded-lg font-bold transition-all shadow-sm whitespace-nowrap shrink-0">
                📡 RSS 관리
            </a>
            <a href="/batch-dashboard" target="_blank" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] lg:text-xs text-slate-200 px-3 lg:px-4 py-1.5 lg:py-2 rounded-lg font-bold transition-all shadow-sm whitespace-nowrap shrink-0">
                🗂️ 배치 대시보드
            </a>
            <a href="/" target="_blank" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] lg:text-xs text-slate-200 px-3 lg:px-4 py-1.5 lg:py-2 rounded-lg font-bold transition-all shadow-sm whitespace-nowrap shrink-0">
                🏠 국내 뉴스
            </a>
        </div>
    </header>

    <!-- 메인 대시보드 그리드 레이아웃 -->
    <!-- 📱 모바일: 고정 그리드 대신 세로로 쌓는 레이아웃 + 각 영역을 크게(약 820px) 키우고 전체 페이지가 스크롤됨 -->
    <!-- 🖥️ lg 이상: 기존 12컬럼 좌우 2분할, 화면 안에 고정(overflow-hidden) 그대로 유지 -->
    <main class="flex-1 flex flex-col lg:grid lg:grid-cols-12 lg:grid-rows-1 lg:overflow-hidden gap-3 lg:gap-6 p-3 lg:p-6 max-w-[1600px] w-full mx-auto">

        <!-- [모바일 상단 / PC 좌측] 1. 포착 키워드 뉴스 영역 -->
        <section class="h-[656px] lg:h-auto lg:col-span-6 bg-slate-900/40 border border-slate-900 rounded-2xl p-3 lg:p-5 flex flex-col overflow-hidden shrink-0 lg:min-h-0">
            <div class="flex flex-wrap justify-between items-center gap-2 mb-3 lg:mb-4 shrink-0 border-b border-slate-900 pb-3">
                <div class="flex items-center gap-2.5">
                    <span class="text-rose-500">🔥</span>
                    <h2 class="text-sm font-black tracking-wider text-rose-400 uppercase">키워드 포착 뉴스 피드</h2>
                </div>
                <!-- 🟢 기존 마크업과 완전히 대칭을 맞추며 색상 스타일을 균형 있게 통일 -->
                <div class="flex items-center gap-4 text-xs text-slate-400 font-medium">
                    <div class="flex items-center gap-1.5">
                        <span>현재 노출 건수:</span>
                        <span id="filtered-render-count" class="bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded border border-blue-500/20 font-bold font-mono">0</span>
                    </div>
                    <div class="flex items-center gap-1.5 border-l border-slate-800 pl-3">
                        <span>이틀간 총 수집 건수:</span>
                        <span id="filtered-count" class="bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-full border border-slate-700 font-black font-mono">0</span>
                    </div>
                </div>
            </div>

            <div class="mb-3 shrink-0 flex items-center gap-2">
                <input type="text" id="filtered-search-input" placeholder="키워드 포착 뉴스 검색 (제목/매체명)"
                       class="flex-1 min-w-0 bg-slate-950 border border-slate-800 text-xs px-3 py-2 rounded-lg focus:outline-none focus:border-rose-500 text-slate-100 placeholder:text-slate-600">
                <button type="button" id="filtered-search-button" aria-label="검색"
                        class="shrink-0 bg-slate-800 hover:bg-rose-600 border border-slate-700 hover:border-rose-500 text-slate-300 hover:text-white text-xs font-bold px-4 py-2 rounded-lg transition-colors">
                    검색
                </button>
            </div>

            <div id="filtered-search-empty" class="hidden text-slate-600 text-xs py-12 text-center shrink-0">검색 결과가 없습니다.</div>

            <div id="filtered-news-container" class="flex-1 overflow-y-auto space-y-3.5 pr-1.5">
                <!-- 포착 기사 렌더링 -->
            </div>
        </section>

        <!-- [모바일 하단 / PC 우측] 2. 전체 원시 뉴스 스트림 영역 -->
        <section class="h-[656px] lg:h-auto lg:col-span-6 bg-slate-900/40 border border-slate-900 rounded-2xl p-3 lg:p-5 flex flex-col overflow-hidden shrink-0 lg:min-h-0">
            <div class="flex flex-wrap justify-between items-center gap-2 mb-3 lg:mb-4 shrink-0 border-b border-slate-900 pb-3">
                <div class="flex items-center gap-3">
                    <span class="text-blue-400">⚡</span>
                    <h2 class="text-sm font-black tracking-wider text-blue-400 uppercase">실시간 전체 뉴스 피드</h2>
                </div>
                <!-- 🟢 기존 마크업과 완전히 대칭을 맞추며 색상 스타일을 균형 있게 통일 -->
                <div class="flex items-center gap-4 text-xs text-slate-400 font-medium shrink-0">
                    <div class="flex items-center gap-1.5">
                        <span>현재 노출 건수:</span>
                        <span id="stream-render-count" class="bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded border border-blue-500/20 font-bold font-mono">0</span>
                    </div>
                    <div class="flex items-center gap-1.5 border-l border-slate-800 pl-3">
                        <span>이틀간 총 수집 건수:</span>
                        <span id="stream-count" class="bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-full border border-slate-700 font-black font-mono">0</span>
                    </div>
                </div>
            </div>

            <div class="mb-3 shrink-0 flex items-center gap-2">
                <input type="text" id="stream-search-input" placeholder="실시간 뉴스 검색 (제목/매체명)"
                       class="flex-1 min-w-0 bg-slate-950 border border-slate-800 text-xs px-3 py-2 rounded-lg focus:outline-none focus:border-blue-500 text-slate-100 placeholder:text-slate-600">
                <button type="button" id="stream-search-button" aria-label="검색"
                        class="shrink-0 bg-slate-800 hover:bg-blue-600 border border-slate-700 hover:border-blue-500 text-slate-300 hover:text-white text-xs font-bold px-4 py-2 rounded-lg transition-colors">
                    검색
                </button>
            </div>

            <div id="stream-search-empty" class="hidden text-slate-600 text-xs py-12 text-center shrink-0">검색 결과가 없습니다.</div>

            <div id="stream-news-container" class="flex-1 overflow-y-auto space-y-3 pr-1.5">
                <!-- 전체 기사 렌더링 -->
            </div>
        </section>

    </main>

    <!-- 푸터 -->
    <footer class="bg-slate-900 border-t border-slate-800 px-8 py-3 text-xs text-slate-500 flex justify-between items-center shrink-0">
        <div>상태: <span class="text-emerald-400 font-bold">● 실시간 감시 엔진 원활</span></div>
        <div class="font-mono text-[10px] text-slate-600">30s 엔진 주기 자동 폴링 동기화 적용됨</div>
    </footer>

    <script>
        const renderedStreamLinks = new Set();
        const renderedFilteredLinks = new Set();
        let targetKeywords = [];
        let combinedKeywordRegex = null; // 카드마다 키워드별로 정규식을 새로 만들지 않도록 1회만 컴파일해 재사용

        // 🟢 [무한 스크롤 제어 변수] 각 섹션별로 현재 화면에 노출된 기사 수(오프셋)를 관리합니다.
        let streamOffset = 0;
        let filteredOffset = 0;
        let isStreamLoading = false;
        let isFilteredLoading = false;

        const urlParams = new URLSearchParams(window.location.search);
        const filterSource = urlParams.get('source');

        async function fetchKeywords() {
            try {
                const res = await fetch('/api/global-keywords');
                targetKeywords = await res.json();
                buildCombinedKeywordRegex();
            } catch (e) {
                console.error("키워드 로드 실패:", e);
            }
        }

        // 💡 [성능] 키워드마다 new RegExp()를 새로 만들어 카드 하나당 수천 번 치환하던 방식을
        // 전체 키워드를 하나의 alternation 정규식으로 합쳐 1회만 컴파일해 재사용하도록 변경.
        // 긴 키워드가 짧은 키워드에 부분적으로 가려지지 않도록 길이 내림차순으로 정렬한다.
        // '/패턴/'처럼 슬래시로 감싼 키워드는 정규식 그대로, 나머지는 리터럴로 이스케이프한다
        // (백엔드 keyword_matches()와 동일한 규칙).
        function buildCombinedKeywordRegex() {
            const parts = targetKeywords
                .map(kw => kw.trim())
                .filter(kw => kw.length > 0)
                .sort((a, b) => b.length - a.length)
                .map(kw => {
                    if (kw.length > 2 && kw.startsWith('/') && kw.endsWith('/')) {
                        return kw.slice(1, -1);
                    }
                    return kw.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                });

            try {
                combinedKeywordRegex = parts.length > 0 ? new RegExp(`(${parts.join('|')})`, 'g') : null;
            } catch (e) {
                // 등록된 정규식 키워드 중 하나가 잘못됐을 때 하이라이팅 전체가 깨지지 않도록 방어
                console.error('키워드 정규식 컴파일 실패 (잘못된 정규식 키워드 포함 가능):', e);
                combinedKeywordRegex = null;
            }
        }

        function createNewsCard(item, isFilteredBox = false) {
            // 🟢 [수정]: JavaScript Date 객체를 거치지 않고, 백엔드가 제공한 한국 시간 문자열(item.time)을 그대로 매핑합니다.
            const timeFormatted = item.time;

            let titleHtml = item.title;

            if (combinedKeywordRegex) {
                titleHtml = titleHtml.replace(combinedKeywordRegex,
                    (matched) => `<span class="bg-amber-400/10 text-amber-400 px-1 py-0.5 rounded border border-amber-400/20 font-bold">${matched}</span>`);
            }

            return `
                <div class="news-entry bg-slate-900/50 hover:bg-slate-900 border border-slate-800/80 hover:border-slate-700/80 p-4 rounded-xl transition-all duration-200">
                    <div class="flex items-center gap-3 mb-2 justify-between">
                        <div class="flex items-center gap-2.5">
                            <span class="bg-slate-800 border border-slate-700 text-slate-300 text-[10px] font-black px-2 py-0.5 rounded tracking-wide">
                                ${item.source}
                            </span>
                            <span class="text-[10px] text-slate-500 font-mono font-semibold">${timeFormatted}</span>
                        </div>
                    </div>
                    <h3 class="text-xs md:text-sm font-semibold text-slate-100 leading-relaxed">
                        <a href="${item.link}" target="_blank" class="hover:text-blue-400 hover:underline transition-colors block">
                            ${titleHtml}
                        </a>
                    </h3>
                </div>
            `;
        }

        function triggerTimeUpdateFlash(isInitial = false) {
            const timeBadge = document.getElementById('time-badge');
            const now = new Date();
            const timeStr = now.toLocaleTimeString();

            if (isInitial) {
                timeBadge.textContent = `초기 뉴스 동기화 완료: ${timeStr}`;
            } else {
                timeBadge.textContent = `최근 뉴스 실시간 유입: ${timeStr}`;
                timeBadge.classList.remove('flash-active');
                void timeBadge.offsetWidth;
                timeBadge.classList.add('flash-active');
            }
        }

        // 🔍 [검색] 화면에 로드된 카드가 아니라, 서버가 메모리에 들고 있는 global_news_list_stream.json
        // 전체(최근 2일 보관분)를 대상으로 /api/global-realtime-news/search를 호출해 결과를 받아온다.
        // 검색 중에는 실시간 폴링/무한스크롤이 검색 결과를 덮어쓰지 않도록 잠시 멈춘다.
        let isStreamSearchActive = false;

        async function performStreamSearch() {
            const q = document.getElementById('stream-search-input').value.trim();

            if (!q) {
                if (isStreamSearchActive) {
                    isStreamSearchActive = false;
                    document.getElementById('stream-search-empty').classList.add('hidden');
                    await loadInitialNews();
                }
                return;
            }

            try {
                const res = await fetch(`/api/global-realtime-news/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                isStreamSearchActive = true;

                const container = document.getElementById('stream-news-container');
                container.innerHTML = data.news.map(item => createNewsCard(item, false)).join('');

                document.getElementById('stream-render-count').textContent = data.news.length;
                document.getElementById('stream-search-empty').classList.toggle('hidden', data.news.length > 0);
            } catch (e) {
                console.error("실시간 뉴스 검색 실패:", e);
            }
        }

        // 🔍 [검색] 키워드 포착 뉴스 피드도 동일하게 서버(global_news_list_filtered.json 전체)에서 검색해온다.
        let isFilteredSearchActive = false;

        async function performFilteredSearch() {
            const q = document.getElementById('filtered-search-input').value.trim();

            if (!q) {
                if (isFilteredSearchActive) {
                    isFilteredSearchActive = false;
                    document.getElementById('filtered-search-empty').classList.add('hidden');
                    await loadInitialNews();
                }
                return;
            }

            try {
                const res = await fetch(`/api/global-filtered-news/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                isFilteredSearchActive = true;

                const container = document.getElementById('filtered-news-container');
                container.innerHTML = data.news.map(item => createNewsCard(item, true)).join('');

                document.getElementById('filtered-render-count').textContent = data.news.length;
                document.getElementById('filtered-search-empty').classList.toggle('hidden', data.news.length > 0);
            } catch (e) {
                console.error("키워드 포착 뉴스 검색 실패:", e);
            }
        }

        function shouldRenderItem(item) {
            if (!filterSource) return true;
            return item.source === filterSource || item.source.includes(`(${filterSource})`);
        }

        // 🚀 초기 로딩 로직 (오프셋 0번부터 최초 100건 로드)
        async function loadInitialNews() {
            try {
                await fetchKeywords();

                if (filterSource) {
                    const badge = document.getElementById('filter-status-badge');
                    const nameSpan = document.getElementById('active-source-name');
                    nameSpan.textContent = filterSource;
                    badge.classList.remove('hidden');
                    badge.classList.add('flex');
                }

                renderedStreamLinks.clear();
                renderedFilteredLinks.clear();
                streamOffset = 0;
                filteredOffset = 0;

                // 1) 전체 뉴스 초기화
                const streamRes = await fetch(`/api/global-realtime-news?offset=${streamOffset}`);
                const streamData = await streamRes.json();
                document.getElementById('stream-count').textContent = streamData.total_count;

                const streamContainer = document.getElementById('stream-news-container');
                let streamHtml = "";
                streamData.news.forEach(item => {
                    renderedStreamLinks.add(item.link);
                    if (shouldRenderItem(item)) streamHtml += createNewsCard(item, false);
                });
                streamContainer.innerHTML = streamHtml || '<div class="text-slate-600 text-xs py-12 text-center">수집 대기 중이거나 기사가 없습니다.</div>';
                streamOffset = streamContainer.querySelectorAll('.news-entry').length;
                document.getElementById('stream-render-count').textContent = streamOffset;

                // 2) 키워드 뉴스 초기화
                const filteredRes = await fetch(`/api/global-filtered-news?offset=${filteredOffset}`);
                const filteredData = await filteredRes.json();
                document.getElementById('filtered-count').textContent = filteredData.total_count;

                const filteredContainer = document.getElementById('filtered-news-container');
                let filteredHtml = "";
                filteredData.news.forEach(item => {
                    renderedFilteredLinks.add(item.link);
                    if (shouldRenderItem(item)) filteredHtml += createNewsCard(item, true);
                });
                filteredContainer.innerHTML = filteredHtml || '<div class="text-slate-600 text-xs py-12 text-center">포착된 소식이 없습니다.</div>';
                filteredOffset = filteredContainer.querySelectorAll('.news-entry').length;
                document.getElementById('filtered-render-count').textContent = filteredOffset;

                if (streamOffset > 0 || filteredOffset > 0) triggerTimeUpdateFlash(true);

            } catch (e) {
                console.error("초기 기사 로드 실패:", e);
            }
        }

        // 🚀 실시간 상단 유입 로직 (기존 2초 폴링 유지, 상단 최신뉴스 추가용)
        async function updateLiveNews() {
            try {
                let anyNew = false;

                // 🔍 검색 중에는 실시간 유입으로 검색 결과가 덮어써지지 않도록 스트림 갱신을 건너뛴다.
                if (!isStreamSearchActive) {
                    // 상단 유입은 항상 가장 최신판(offset=0) 상자에서 새로 들어온 기사만 체크합니다.
                    const streamRes = await fetch('/api/global-realtime-news?offset=0');
                    const streamData = await streamRes.json();
                    document.getElementById('stream-count').textContent = streamData.total_count;

                    const streamContainer = document.getElementById('stream-news-container');

                    [...streamData.news].reverse().forEach(item => {
                        if (renderedStreamLinks.has(item.link)) return;
                        renderedStreamLinks.add(item.link);

                        if (shouldRenderItem(item)) {
                            const card = createNewsCard(item, false);
                            const temp = document.createElement('div');
                            temp.innerHTML = card;
                            if (streamContainer.firstChild && streamContainer.querySelector('.news-entry')) {
                                streamContainer.insertBefore(temp.firstElementChild, streamContainer.firstChild);
                            } else {
                                streamContainer.innerHTML = "";
                                streamContainer.appendChild(temp.firstElementChild);
                            }
                            anyNew = true;
                            streamOffset++; // 상단 유입 시 전체 카운트 증가
                        }
                    });
                    document.getElementById('stream-render-count').textContent = streamContainer.querySelectorAll('.news-entry').length;
                }

                // 🔍 검색 중에는 실시간 유입으로 검색 결과가 덮어써지지 않도록 갱신을 건너뛴다.
                if (!isFilteredSearchActive) {
                    const filteredRes = await fetch('/api/global-filtered-news?offset=0');
                    const filteredData = await filteredRes.json();
                    document.getElementById('filtered-count').textContent = filteredData.total_count;

                    const filteredContainer = document.getElementById('filtered-news-container');
                    [...filteredData.news].reverse().forEach(item => {
                        if (renderedFilteredLinks.has(item.link)) return;
                        renderedFilteredLinks.add(item.link);

                        if (shouldRenderItem(item)) {
                            const card = createNewsCard(item, true);
                            const temp = document.createElement('div');
                            temp.innerHTML = card;
                            if (filteredContainer.firstChild && filteredContainer.querySelector('.news-entry')) {
                                filteredContainer.insertBefore(temp.firstElementChild, filteredContainer.firstChild);
                            } else {
                                filteredContainer.innerHTML = "";
                                filteredContainer.appendChild(temp.firstElementChild);
                            }
                            anyNew = true;
                            filteredOffset++;
                        }
                    });
                    document.getElementById('filtered-render-count').textContent = filteredContainer.querySelectorAll('.news-entry').length;
                }

                if (anyNew) triggerTimeUpdateFlash(false);

            } catch (e) {
                console.error("실시간 갱신 실패:", e);
            }
        }

        // 🟢 [신규 기능]: 스크롤 하단 도달 시 과거 데이터를 불러와 아래에 붙이는 무한 스크롤 엔진
        async function loadMorePastNews(isFilteredBox = false) {
            if (isFilteredBox) {
                if (isFilteredLoading || isFilteredSearchActive) return; // 검색 결과 표시 중엔 무한 스크롤 비활성
                isFilteredLoading = true;
                try {
                    const res = await fetch(`/api/global-filtered-news?offset=${filteredOffset}`);
                    const data = await res.json();
                    if (data.news && data.news.length > 0) {
                        const container = document.getElementById('filtered-news-container');
                        let html = "";
                        data.news.forEach(item => {
                            if (renderedFilteredLinks.has(item.link)) return;
                            renderedFilteredLinks.add(item.link);
                            if (shouldRenderItem(item)) html += createNewsCard(item, true);
                        });
                        if (html) {
                            const temp = document.createElement('div');
                            temp.innerHTML = html;
                            while (temp.firstChild) container.appendChild(temp.firstChild);
                        }
                        filteredOffset = container.querySelectorAll('.news-entry').length;
                        document.getElementById('filtered-render-count').textContent = filteredOffset;
                    }
                } catch (e) { console.error("과거 키워드 뉴스 로드 실패:", e); }
                isFilteredLoading = false;
            } else {
                if (isStreamLoading || isStreamSearchActive) return; // 검색 결과 표시 중엔 무한 스크롤 비활성
                isStreamLoading = true;
                try {
                    const res = await fetch(`/api/global-realtime-news?offset=${streamOffset}`);
                    const data = await res.json();
                    if (data.news && data.news.length > 0) {
                        const container = document.getElementById('stream-news-container');
                        let html = "";
                        data.news.forEach(item => {
                            if (renderedStreamLinks.has(item.link)) return;
                            renderedStreamLinks.add(item.link);
                            if (shouldRenderItem(item)) html += createNewsCard(item, false);
                        });
                        if (html) {
                            const temp = document.createElement('div');
                            temp.innerHTML = html;
                            while (temp.firstChild) container.appendChild(temp.firstChild);
                        }
                        streamOffset = container.querySelectorAll('.news-entry').length;
                        document.getElementById('stream-render-count').textContent = streamOffset;
                    }
                } catch (e) { console.error("과거 전체 뉴스 로드 실패:", e); }
                isStreamLoading = false;
            }
        }

        // 🟢 개별 컨테이너 내부 스크롤 감지 이벤트 등록
        window.addEventListener('DOMContentLoaded', async () => {
            await loadInitialNews();
            setInterval(updateLiveNews, 2000);

            // 🔍 검색 버튼 클릭 또는 엔터로 서버 검색 실행
            const streamSearchInput = document.getElementById('stream-search-input');
            document.getElementById('stream-search-button').addEventListener('click', performStreamSearch);
            streamSearchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') performStreamSearch();
            });

            const filteredSearchInput = document.getElementById('filtered-search-input');
            document.getElementById('filtered-search-button').addEventListener('click', performFilteredSearch);
            filteredSearchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') performFilteredSearch();
            });

            // 좌측 키워드 박스 스크롤 감시
            document.getElementById('filtered-news-container').addEventListener('scroll', function() {
                // 바닥에서 30px 이내로 접근했을 때 촉발
                if (this.scrollTop + this.clientHeight >= this.scrollHeight - 30) {
                    loadMorePastNews(true);
                }
            });

            // 우측 전체뉴스 박스 스크롤 감시
            document.getElementById('stream-news-container').addEventListener('scroll', function() {
                if (this.scrollTop + this.clientHeight >= this.scrollHeight - 30) {
                    loadMorePastNews(false);
                }
            });
        });
    </script>
</body>
</html>
