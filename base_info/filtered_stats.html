<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키워드 포착 뉴스 통계</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col overflow-x-hidden">

    <header class="bg-slate-900 border-b border-slate-800 px-4 lg:px-8 py-3 lg:py-4 flex flex-col lg:flex-row gap-2 lg:gap-0 lg:justify-between lg:items-center shrink-0">
        <div class="flex items-center gap-3 min-w-0">
            <span class="text-xl shrink-0">📊</span>
            <h1 class="text-sm lg:text-base font-extrabold tracking-wide text-white flex flex-wrap items-center gap-2 min-w-0">
                키워드 포착 뉴스 통계
                <span class="text-xs text-blue-400 font-bold bg-blue-950/60 border border-blue-900/40 px-2.5 py-0.5 rounded-full shrink-0">요일별 · 일별</span>
            </h1>
        </div>
        <div class="flex items-center gap-3 shrink-0">
            <button onclick="window.close()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] lg:text-xs text-slate-300 px-3 lg:px-4 py-1.5 lg:py-2 rounded-lg font-bold transition-all shadow-sm whitespace-nowrap shrink-0">
                🚪 창 닫기
            </button>
        </div>
    </header>

    <main class="flex-1 w-full max-w-6xl mx-auto px-4 py-8 space-y-6">

        <!-- 탭 전환 -->
        <div class="flex items-center gap-2">
            <button id="tab-domestic" onclick="switchTab('domestic')"
                    class="px-4 py-2 rounded-lg text-sm font-bold transition-colors bg-blue-600 text-white">
                🇰🇷 국내
            </button>
            <button id="tab-global" onclick="switchTab('global')"
                    class="px-4 py-2 rounded-lg text-sm font-bold transition-colors bg-slate-800 text-slate-400 hover:bg-slate-700">
                🌐 해외
            </button>
        </div>

        <!-- 요일별 통계 -->
        <section class="bg-slate-900 border border-slate-800/80 rounded-2xl p-6 shadow-xl">
            <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-5 flex items-center gap-1.5">
                <span>📅</span> 요일별 평균 포착 건수
            </h2>
            <div id="weekday-chart" class="space-y-3"></div>
        </section>

        <!-- 일별 통계 -->
        <section class="bg-slate-900 border border-slate-800/80 rounded-2xl p-6 shadow-xl">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                    <span>📈</span> 일별 포착 건수
                </h2>
                <span class="text-[11px] text-slate-500">💡 news_back_up 폴더의 저장된 파일을 그대로 읽어 건수만 집계합니다 (오늘은 실시간 캐시 기준).</span>
            </div>
            <div id="daily-chart" class="space-y-2"></div>
        </section>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800/80 px-8 py-3 text-xs text-slate-500 flex justify-between items-center shrink-0">
        <div>현재 모드: <strong>통계 열람 전용 모드 (읽기 전용)</strong></div>
        <a href="/" class="text-blue-400 hover:text-blue-300 font-bold transition-colors">
            🏠 메인 감시센터로 가기 ▶
        </a>
    </footer>

    <script>
        let currentTab = 'domestic';
        const statsCache = {};

        const ENDPOINTS = {
            domestic: '/api/filtered-news/stats',
            global: '/api/global-filtered-news/stats',
        };

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-domestic').className =
                `px-4 py-2 rounded-lg text-sm font-bold transition-colors ${tab === 'domestic' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`;
            document.getElementById('tab-global').className =
                `px-4 py-2 rounded-lg text-sm font-bold transition-colors ${tab === 'global' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`;
            render();
        }

        function formatDateLabel(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            const weekdayNames = ['일', '월', '화', '수', '목', '금', '토'];
            return `${dateStr} (${weekdayNames[d.getDay()]})`;
        }

        function renderBarRow(container, label, value, maxValue, sublabel, colorClass) {
            const pct = maxValue > 0 ? Math.max((value / maxValue) * 100, value > 0 ? 2 : 0) : 0;
            const row = document.createElement('div');
            row.className = 'flex items-center gap-3';
            row.innerHTML = `
                <span class="w-28 shrink-0 text-xs text-slate-400 font-semibold truncate" title="${label}">${label}</span>
                <div class="flex-1 h-5 bg-slate-800/60 rounded overflow-hidden">
                    <div class="h-full ${colorClass} rounded transition-all duration-300" style="width: ${pct}%;"></div>
                </div>
                <span class="w-36 shrink-0 text-xs text-slate-300 font-mono font-bold text-right whitespace-nowrap">${sublabel}</span>
            `;
            container.appendChild(row);
        }

        function renderWeekday(data) {
            const container = document.getElementById('weekday-chart');
            container.innerHTML = '';

            if (!data.length || data.every(w => w.total === 0)) {
                container.innerHTML = '<div class="text-slate-600 text-xs py-8 text-center">아직 집계할 데이터가 없습니다.</div>';
                return;
            }

            const maxAvg = Math.max(...data.map(w => w.average));
            data.forEach(w => {
                renderBarRow(container, `${w.weekday}요일`, w.average, maxAvg,
                    `평균 ${w.average}건 (${w.days}일)`, 'bg-blue-500');
            });
        }

        function renderDaily(data) {
            const container = document.getElementById('daily-chart');
            container.innerHTML = '';

            if (!data.length) {
                container.innerHTML = '<div class="text-slate-600 text-xs py-8 text-center">아직 집계할 데이터가 없습니다.</div>';
                return;
            }

            const sorted = [...data].sort((a, b) => b.date.localeCompare(a.date));
            const maxCount = Math.max(...data.map(d => d.count));
            sorted.forEach(d => {
                renderBarRow(container, formatDateLabel(d.date), d.count, maxCount,
                    `${d.count.toLocaleString()}건`, 'bg-emerald-500');
            });
        }

        async function loadStats(tab) {
            if (statsCache[tab]) return statsCache[tab];
            const res = await fetch(ENDPOINTS[tab]);
            const data = await res.json();
            statsCache[tab] = data;
            return data;
        }

        async function render() {
            try {
                const data = await loadStats(currentTab);
                renderWeekday(data.weekday || []);
                renderDaily(data.daily || []);
            } catch (e) {
                console.error('통계 로드 실패:', e);
            }
        }

        render();
    </script>
</body>
</html>
